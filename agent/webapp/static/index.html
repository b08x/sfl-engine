<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFL Gate Agent</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14161a; color: #e8e8ea; margin: 0; display: flex; justify-content: center; }
  main { width: 100%; max-width: 760px; padding: 1.5rem 1rem 5rem; }
  h1 { font-size: 1.2rem; }
  h1 small { display: block; font-weight: 400; color: #9aa0ab; font-size: .85rem; margin-top: .3rem; }
  #log { display: flex; flex-direction: column; gap: .75rem; margin-top: 1rem; }
  .msg { padding: .7rem 1rem; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; }
  .user { background: #2b3145; align-self: flex-end; max-width: 85%; }
  .agent { background: #1d232e; border: 1px solid #2c3444; align-self: flex-start; max-width: 95%; }
  form { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; background: #14161aee; padding: .75rem 0; }
  form div { display: flex; gap: .5rem; width: 100%; max-width: 760px; padding: 0 1rem; }
  input { flex: 1; padding: .65rem .8rem; border-radius: 8px; border: 1px solid #3a4150; background: #1d232e; color: inherit; font-size: 1rem; }
  button { padding: .65rem 1.1rem; border-radius: 8px; border: 0; background: #7c6cf0; color: white; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>SFL Gate Agent
    <small>Raw input &rarr; deterministic SFL metafunction gate &rarr; functional agent. Every message you type is annotated before the model sees it.</small>
  </h1>
  <div id="log"></div>
</main>
<form id="f"><div>
  <input id="m" autocomplete="off" placeholder="Type anything — messy, rambling, disparate…">
  <button id="b">Send</button>
</div></form>
<script>
const log = document.getElementById("log");
const input = document.getElementById("m");
const send = document.getElementById("b");
let sessionId = localStorage.getItem("sflSession") || null;
function add(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  window.scrollTo(0, document.body.scrollHeight);
}
add("Send a message to start. Try something messy — the gate will expand and annotate it with the systemic functional linguistics metafunctions before the agent answers.", "agent");
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "user");
  input.value = "";
  send.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem("sflSession", sessionId);
    add(data.reply, "agent");
  } catch (err) {
    add("Request failed: " + err, "agent");
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
