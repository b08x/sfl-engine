[project]
name = "sfl-gate-agent"
version = "0.1.0"
description = "Conversational agent behind a deterministic Systemic Functional Linguistics prompt-engineering gate, built with the Mistral Agents SDK."
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents==1.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.mistralai.agents]
entrypoint = "main:agent"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
